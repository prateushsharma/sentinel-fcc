name: Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"
          cache-dependency-path: |
            go/go.sum
            tools/go.sum

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck

      - name: Configure extension language
        run: |
          cp .env.example .env
          if grep -q '^LANGUAGE=' .env; then
            sed -i 's/^LANGUAGE=.*/LANGUAGE=go/' .env
          else
            printf '\nLANGUAGE=go\n' >> .env
          fi

      - name: Verify
        run: ./scripts/sentinel/verify.sh --ci
