name: Bug report
description: Report a reproducible non-sensitive defect
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not submit vulnerabilities, secrets, private policies, or exploit details here. Follow SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps without sensitive data.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Git commit SHA where the issue occurs.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Go, Foundry, Docker, and relevant testnet/local configuration.
